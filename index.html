<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Audífono - Centro Auditivo Jesús</title>
    
    <!-- Configuración PWA y Móvil -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Audífono">
    <link rel="apple-touch-icon" href="https://centroauditivojesus.wordpress.com/wp-content/uploads/2017/10/cropped-corazc3b3n1.jpg?w=180">
    
    <!-- Librerías -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .progress-glow { box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        
        /* Animación para el botón de instalación */
        @keyframes pulse-soft {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .animate-install { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const LOGO_URL = "https://centroauditivojesus.wordpress.com/wp-content/uploads/2017/10/cropped-corazc3b3n1.jpg?w=96"; 
        const CONTACT_URL = "https://centroauditivojesus.com/contacto/";

        const Icons = {
            Battery: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg>,
            Calendar: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            History: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Settings: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Download: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Share: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Timer: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        };

        const BATTERY_TYPES = {
            10: { color: 'bg-yellow-400', text: 'text-yellow-900', name: 'Amarillo (10)', avgHours: 48 },
            13: { color: 'bg-orange-500', text: 'text-orange-50', name: 'Naranja (13)', avgHours: 72 },
            312: { color: 'bg-yellow-800', text: 'text-yellow-50', name: 'Marrón (312)', avgHours: 60 },
            675: { color: 'bg-blue-600', text: 'text-blue-50', name: 'Azul (675)', avgHours: 96 },
        };

        function App() {
            const [activeTab, setActiveTab] = useState('pilas');
            const [batteryType, setBatteryType] = useState('312');
            const [stock, setStock] = useState(0);
            const [history, setHistory] = useState([]);
            const [lastChange, setLastChange] = useState(null);
            const [elapsedHours, setElapsedHours] = useState(0);
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            // Lógica para detectar si se puede instalar (Android/Chrome)
            useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });
            }, []);

            // Carga inicial
            useEffect(() => {
                const saved = localStorage.getItem('audifono_pwa_v1');
                if (saved) {
                    const data = JSON.parse(saved);
                    setBatteryType(data.batteryType || '312');
                    setStock(data.stock || 0);
                    setHistory(data.history || []);
                    setLastChange(data.lastChange || null);
                }
            }, []);

            // Guardado automático
            useEffect(() => {
                localStorage.setItem('audifono_pwa_v1', JSON.stringify({ batteryType, stock, history, lastChange }));
            }, [batteryType, stock, history, lastChange]);

            // Cronómetro
            useEffect(() => {
                const timer = setInterval(() => {
                    if (lastChange) {
                        const diff = (new Date() - new Date(lastChange)) / (1000 * 60 * 60);
                        setElapsedHours(parseFloat(diff.toFixed(1)));
                    }
                }, 10000);
                return () => clearInterval(timer);
            }, [lastChange]);

            const installApp = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') setDeferredPrompt(null);
            };

            const theme = BATTERY_TYPES[batteryType];
            const progress = Math.min((elapsedHours / theme.avgHours) * 100, 100);

            return (
                <div className="flex flex-col min-h-screen max-w-md mx-auto bg-slate-50 shadow-2xl">
                    {/* Header */}
                    <header className={`${theme.color} ${theme.text} p-5 sticky top-0 z-50 shadow-lg flex justify-between items-center transition-colors duration-500`}>
                        <div className="flex items-center gap-3">
                            <img src={LOGO_URL} className="w-10 h-10 rounded-xl bg-white p-1" alt="Logo" />
                            <div>
                                <h1 className="font-black uppercase text-xs tracking-widest leading-none">Centro Auditivo Jesús</h1>
                                <p className="text-[10px] font-bold opacity-70">App Oficial</p>
                            </div>
                        </div>
                        <div className="bg-black/10 px-3 py-1 rounded-full text-[10px] font-black border border-black/5">PILA {batteryType}</div>
                    </header>

                    <main className="flex-grow p-4 pb-24 space-y-6">
                        {activeTab === 'pilas' && (
                            <div className="space-y-6 animate-in fade-in duration-500">
                                {/* Stock Card */}
                                <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-200">
                                    <h2 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Pilas en reserva</h2>
                                    <div className="text-6xl font-black text-slate-900 tracking-tighter">{stock}</div>
                                </div>

                                {/* Botón Principal */}
                                <button 
                                    onClick={() => {
                                        if(stock > 0) {
                                            const now = new Date().toISOString();
                                            setStock(s => s - 1);
                                            setLastChange(now);
                                            setHistory([{date: now, duration: elapsedHours}, ...history]);
                                        } else { alert("Sin pilas en stock"); }
                                    }}
                                    className={`w-full py-10 rounded-[2.5rem] ${theme.color} ${theme.text} font-black text-2xl uppercase shadow-xl border-b-8 border-black/20 active:translate-y-1 active:border-b-0 transition-all`}
                                >
                                    Cambiar Pila
                                </button>

                                {/* Contador Visual */}
                                <div className="bg-white p-6 rounded-[2.5rem] border border-slate-200 shadow-sm space-y-4">
                                    <div className="flex justify-between items-end">
                                        <div>
                                            <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><Icons.Timer /> Uso actual</h3>
                                            <div className="text-4xl font-black text-slate-800 mt-1">{elapsedHours} <span className="text-sm text-slate-400">h</span></div>
                                        </div>
                                        <div className="text-[10px] font-black text-slate-300 uppercase">Estimado: {theme.avgHours}h</div>
                                    </div>
                                    <div className="w-full h-5 bg-slate-100 rounded-full overflow-hidden p-1">
                                        <div className={`h-full rounded-full transition-all duration-1000 progress-glow ${progress > 85 ? 'bg-red-500' : 'bg-blue-500'}`} style={{width: `${progress}%`}} />
                                    </div>
                                </div>

                                {/* Gestión Stock */}
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setStock(s => s + 6)} className="bg-white p-4 rounded-3xl border border-slate-200 font-black text-slate-600 uppercase text-xs">+6 Pilas</button>
                                    <button onClick={() => setStock(s => s + 12)} className="bg-white p-4 rounded-3xl border border-slate-200 font-black text-slate-600 uppercase text-xs">+12 Pilas</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'config' && (
                            <div className="space-y-6 animate-in slide-in-from-bottom-4 duration-500">
                                {/* INSTALACIÓN (PWA) */}
                                <div className="bg-blue-600 p-6 rounded-[2.5rem] text-white space-y-4 shadow-lg">
                                    <h3 className="font-black uppercase text-sm flex items-center gap-2"><Icons.Download /> Instalar Aplicación</h3>
                                    <p className="text-xs font-medium opacity-90">Lleva tu control de pilas siempre en el móvil sin necesidad de internet.</p>
                                    
                                    {deferredPrompt ? (
                                        <button onClick={installApp} className="w-full bg-white text-blue-600 font-black py-4 rounded-2xl uppercase text-xs animate-install shadow-lg">Instalar ahora</button>
                                    ) : (
                                        <div className="bg-black/20 p-4 rounded-2xl text-[10px] font-bold space-y-2">
                                            <p className="flex items-center gap-2 opacity-100"><Icons.Share /> En iPhone (Safari):</p>
                                            <p className="opacity-70">Pulsa el botón "Compartir" de abajo y luego "Añadir a pantalla de inicio".</p>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white p-6 rounded-[2.5rem] border border-slate-200">
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Ajustes del Audífono</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        {Object.keys(BATTERY_TYPES).map(k => (
                                            <button key={k} onClick={() => setBatteryType(k)} className={`p-4 rounded-2xl border-2 font-black transition-all ${batteryType === k ? 'border-blue-600 bg-blue-50 text-blue-600' : 'border-slate-100 text-slate-300'}`}>Pila {k}</button>
                                        ))}
                                    </div>
                                </div>
                                
                                <button onClick={() => window.open(CONTACT_URL)} className="w-full py-5 bg-slate-900 text-white rounded-3xl font-black uppercase text-xs flex justify-center items-center gap-2 tracking-widest">Contactar Clínica</button>
                            </div>
                        )}

                        {activeTab === 'logs' && (
                            <div className="bg-white rounded-[2.5rem] border border-slate-200 overflow-hidden shadow-sm">
                                <div className="p-5 border-b font-black text-[10px] text-slate-400 uppercase tracking-widest bg-slate-50">Historial de cambios</div>
                                {history.length === 0 ? <div className="p-10 text-center text-slate-300 font-black uppercase text-[10px]">Sin registros todavía</div> : 
                                    history.map((h, i) => (
                                        <div key={i} className="p-5 border-b flex justify-between items-center last:border-0">
                                            <div>
                                                <div className="font-black text-slate-800 text-sm">{new Date(h.date).toLocaleDateString()}</div>
                                                <div className="text-[10px] font-bold text-slate-400 uppercase">{new Date(h.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                                            </div>
                                            {h.duration && <div className="text-blue-600 font-black text-sm">{h.duration}h</div>}
                                        </div>
                                    ))
                                }
                            </div>
                        )}
                    </main>

                    {/* Navbar */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-slate-200 flex justify-around pb-safe z-50">
                        <button onClick={() => setActiveTab('pilas')} className={`p-4 flex flex-col items-center flex-1 transition-all ${activeTab === 'pilas' ? 'text-blue-600 scale-110' : 'text-slate-300'}`}>
                            <Icons.Battery /><span className="text-[8px] font-black uppercase mt-1">Pilas</span>
                        </button>
                        <button onClick={() => setActiveTab('logs')} className={`p-4 flex flex-col items-center flex-1 transition-all ${activeTab === 'logs' ? 'text-blue-600 scale-110' : 'text-slate-300'}`}>
                            <Icons.History /><span className="text-[8px] font-black uppercase mt-1">Historial</span>
                        </button>
                        <button onClick={() => setActiveTab('config')} className={`p-4 flex flex-col items-center flex-1 transition-all ${activeTab === 'config' ? 'text-blue-600 scale-110' : 'text-slate-300'}`}>
                            <Icons.Settings /><span className="text-[8px] font-black uppercase mt-1">App</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
